<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayra — console</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --line: #262d38;
    --text: #d8dee6;
    --dim: #7d8794;
    --accent: #6ee7b7;
    --user: #2c3441;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: grid; grid-template-columns: 1fr 280px;
    background: var(--bg); color: var(--text);
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; } aside { display: none; } }

  main { display: flex; flex-direction: column; min-width: 0; }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 10px;
  }
  header b { font-weight: 600; letter-spacing: .02em; }
  header span { color: var(--dim); font-size: 12px; font-family: ui-monospace, monospace; }

  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 720px; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.ayra { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .msg.erro { align-self: flex-start; color: #fca5a5; font-size: 13px; }
  .msg.ayra.streaming::after {
    content: "▋"; color: var(--accent); animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .msg.ayra.streaming::after { animation: none; } }

  form { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); }
  input, button {
    font: inherit; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); padding: 10px 14px;
  }
  input { flex: 1; }
  input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { background: var(--accent); color: #06281d; font-weight: 600; border: none; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }

  /* Painel de fontes: o elemento central deste console.
     Se a Ayra não consegue dizer o que leu, ela é uma caixa-preta. */
  aside { border-left: 1px solid var(--line); padding: 20px; overflow-y: auto; }
  aside h2 {
    font: 600 11px/1 ui-monospace, monospace; letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim); margin: 0 0 14px;
  }
  .fonte {
    border-left: 2px solid var(--accent); padding: 4px 0 4px 10px;
    margin-bottom: 12px; font-size: 13px;
  }
  .fonte small {
    display: block; color: var(--dim);
    font: 11px ui-monospace, monospace; letter-spacing: .04em;
  }
  .vazio { color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <b>Ayra</b>
    <span id="sess">sessão: —</span>
  </header>
  <div id="log" role="log" aria-live="polite"></div>
  <form id="form">
    <input id="msg" placeholder="Escreva para a Ayra" autocomplete="off" required>
    <button id="send">Enviar</button>
  </form>
</main>

<aside>
  <h2>O que a Ayra leu</h2>
  <div id="fontes"><p class="vazio">Nada ainda. As fontes usadas em cada resposta aparecem aqui.</p></div>
</aside>

<script>
// Servido pelo próprio FastAPI em "/", então mesma origem: sem CORS, sem porta fixa.
// Se um dia servir o front separado (Vite, Vercel), aponte para a URL da API aqui.
const API   = "";
const TOKEN = "";           // cole aqui o valor de ATLAS_API_TOKEN, se tiver configurado

const log    = document.getElementById("log");
const fontes = document.getElementById("fontes");
const form   = document.getElementById("form");
const input  = document.getElementById("msg");
const send   = document.getElementById("send");
const sess   = document.getElementById("sess");
let sessionId = null;

function bubble(cls, text = "") {
  const el = document.createElement("div");
  el.className = `msg ${cls}`;
  el.textContent = text;
  log.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function renderFontes(lista) {
  fontes.innerHTML = "";
  if (!lista.length) {
    fontes.innerHTML = '<p class="vazio">Respondeu sem consultar a memória.</p>';
    return;
  }
  for (const f of lista) {
    const el = document.createElement("div");
    el.className = "fonte";
    el.innerHTML = `<small>${f.tipo}</small>`;
    el.append(f.rotulo);
    fontes.append(el);
  }
}

// EventSource só faz GET. Como o chat é POST, o SSE é lido na mão.
async function* sseFrom(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const frames = buf.split("\n\n");
    buf = frames.pop();
    for (const frame of frames) {
      let event = "message";
      const data = [];
      for (const line of frame.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data.push(line.slice(5).replace(/^ /, ""));
      }
      yield { event, data: data.join("\n") };
    }
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  bubble("user", text);
  input.value = "";
  send.disabled = true;

  const reply = bubble("ayra");
  reply.classList.add("streaming");

  try {
    const res = await fetch(`${API}/chat`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        ...(TOKEN && { Authorization: `Bearer ${TOKEN}` }),
      },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    for await (const { event, data } of sseFrom(res)) {
      if (event === "session") {
        sessionId = data;
        sess.textContent = `sessão: ${data.slice(0, 8)}`;
      } else if (event === "token") {
        reply.textContent += data;
        log.scrollTop = log.scrollHeight;
      } else if (event === "sources") {
        renderFontes(JSON.parse(data));
      } else if (event === "error") {
        bubble("erro", `A Ayra falhou no meio da resposta: ${data}`);
      }
    }
  } catch (err) {
    reply.remove();
    bubble("erro", `Não deu para falar com o servidor (${err.message}). O uvicorn ainda está rodando?`);
  } finally {
    reply.classList.remove("streaming");
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
